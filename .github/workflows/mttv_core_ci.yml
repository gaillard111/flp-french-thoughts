name: mttv-core CI

on:
  push:
    paths: ["mttv_core/**", "tests/**", "pyproject.toml", "docs/**", ".github/workflows/mttv_core_ci.yml"]
  pull_request:
    paths: ["mttv_core/**", "tests/**", "pyproject.toml", "docs/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      # Le dépôt flp-french-thoughts est volumineux (app PHP, PDFs, sous-modules) :
      # le checkout complet échoue sur le runner (git exit 128). Clone partiel +
      # shallow : seuls les arbres/commits sont téléchargés, les blobs à la demande.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: 'blob:none'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install .

      - name: Test — fondation (18)
        run: python tests/test_mttv_core.py

      - name: Test — pont MPVR (10)
        run: python tests/test_mpvr_bridge.py

      - name: Test — intégration croisée (5, auto-skip si dépôt imbriqué absent)
        run: python tests/test_integration_mpvr_cross.py

      - name: Test — invariants reproductibles (20)
        run: python docs/verifier_invariants.py

      - name: Test — couche de décence (14)
        run: python tests/test_decence.py

      - name: Test — consensus inter-IA (7)
        run: python tests/test_consensus.py

      - name: Test — IGIC + modulation A3 (10)
        run: python tests/test_igic.py

      - name: Test — gouvernail A3 + scénarios (9)
        run: python tests/test_gouvernail_scenarios.py

      - name: Test — ancrage sémantique (7)
        run: python tests/test_ancrage.py

      - name: Test — mode sénescence (6)
        run: python tests/test_senescence.py

      - name: Benchmark — grande échelle A6.1 (N=500)
        run: python -m mttv_core.benchmark_echelle --n 500 --tours 20

      - name: Calibration — corpus réel (rapport)
        run: python -m mttv_core.calibration
