imports:
    - { resource: parameters.yml }
    - { resource: security.yml }
    - { resource: services.yml }
    - { resource: "@ThoughtBundle/Resources/config/services.yml" }
    - { resource: "@ApplicationSonataUserBundle/Resources/config/services.yml" }

# Put parameters here that don't need to change on each machine where the app is deployed
# http://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: fr

framework:
    #esi:             ~
    translator:      { fallbacks: ["%locale%"] }
    secret:          "%secret%"
    router:
        resource: "%kernel.root_dir%/config/routing.yml"
        strict_requirements: ~
    form:            ~
    csrf_protection: ~
    validation:      { enable_annotations: true }
    #serializer:      { enable_annotations: true }
    templating:
        engines: ['twig']
    default_locale:  "%locale%"
    trusted_hosts:   ~
    trusted_proxies: ~
    session:
        # handler_id set to null will use default session handler from php.ini
        handler_id:  ~
    fragments:       ~
    http_method_override: true

# Twig Configuration
twig:
    cache: false
    debug:            "%kernel.debug%"
    strict_variables: "%kernel.debug%"

    #sonata
    form:
        resources:
            - 'SonataFormatterBundle:Form:formatter.html.twig'

# Doctrine Configuration
doctrine:
    dbal:
        driver:   pdo_mysql
        host:     "%database_host%"
        port:     "%database_port%"
        dbname:   "%database_name%"
        user:     "%database_user%"
        password: "%database_password%"
        charset:  UTF8
        # if using pdo_sqlite as your database driver:
        #   1. add the path in parameters.yml
        #     e.g. database_path: "%kernel.root_dir%/data/data.db3"
        #   2. Uncomment database_path in parameters.yml.dist
        #   3. Uncomment next line:
        #     path:     "%database_path%"
        types:
            json: Sonata\Doctrine\Types\JsonType

    orm:
        auto_generate_proxy_classes: "%kernel.debug%"

        #auto_mapping: true

        entity_managers:
            default:
                auto_mapping: true
                naming_strategy: doctrine.orm.naming_strategy.underscore

# Swiftmailer Configuration
swiftmailer:
    transport:  "%mailer_transport%"
    host:       "%mailer_host%"
    username:   "%mailer_user%"
    password:   "%mailer_password%"
    encryption: "%mailer_encryption%"
    auth_mode:  "%mailer_auth_mode%"
    port:       "%mailer_port%"

sonata_block:
    default_contexts: [cms]
    blocks:
        # Enable the SonataAdminBundle block
        sonata.admin.block.admin_list:
           contexts:  [admin]
        sonata.user.block.menu:  # used to display the menu in profile pages
        sonata.user.block.account: # used to display menu option (login option)
        sonata.block.service.text: # used to if you plan to use Sonata user routes

sonata_admin:
    title: 'French thoughts'
    security:
        handler: sonata.admin.security.handler.role
        information:
            EDIT: EDIT
            LIST: LIST
            CREATE: CREATE
            VIEW: VIEW
            DELETE: DELETE
            EXPORT: EXPORT
            OPERATOR: OPERATOR
            MASTER: MASTER
            ALL: ALL
    templates:
        # default global templates
        layout:  ThoughtBundle::Sonata/Admin/layout.html.twig
#        list:    ThoughtBundle::CRUD/base_list.html.twig

    dashboard:
        groups:
            sonata_user:
                label: Users
                items:
                    - sonata.user.admin.user
            Emails:
                label: Emails
                items:
                    - thoudght.admin.mail
            Thoughts:
                label: Thoughts
                items:
                    - thoudght.admin.thought
                    - thoudght.admin.topic
            Content:
                label: Content
                items: {Content: thoudght.admin.content}

            Authors:
                label: Authors
                items: {Content: thoudght.admin.author}


sonata_user:
    #security_acl: true # Uncomment for ACL support
    manager_type: orm # can be orm or mongodb
    class:
        user: Application\Sonata\UserBundle\Entity\User
    profile:
        dashboard:
            blocks:
                - { position: left, type: sonata.block.service.text, settings: { content: "<h2>Ami(e) du français bonjour!</h2> Merci d'avoir franchi cette première étape. Merci de donner le plus de détails possibles si vous proposez une citation. Pour indiquer catégories et tags, vous pouvez consulter <a href='/?search[words]=étiquetage  Paz&search[field][content]=on&search[field][category]=on&search[field][tags]=on&search[field][author]=on&search[field][thoughtInfo]=on&search[max_words]=0&search[min_words]=0&search[sorting]=amount'>ceci</a>"} }
        menu:
            - { route: 'sonata_user_profile_show', label: 'user.dashboard.menu.link_dashboard', domain: 'messages'}
            - { route: 'sonata_user_profile_edit', label: 'user.dashboard.menu.link_profile', domain: 'messages'}
            - { route: 'sonata_user_thought_create', label: 'user.thought.create_page.title', domain: 'messages'}
            - { route: 'sonata_user_thoughts', label: 'user.thought.list_page.title', domain: 'messages'}
            - { route: 'sonata_user_chains', label: 'user.dashboard.menu.link_chains', domain: 'messages'}
            - { route: 'sonata_user_shared_chains', label: 'user.dashboard.menu.link_shared_chains', domain: 'messages'}

        form:
            type:               application_sonata_user_profile
            handler:            sonata.user.profile.form.handler.default
            name:               application_sonata_user_profile
            validation_groups:
                - CustomProfile

        register:
            form:
                type:           front_user_registration
                handler:        sonata.user.registration.form.handler.default
                name:           front_user_registration_form
                validation_groups:
                    - CustomRegistration
    admin:
        user:
          class:      ThoughtBundle\Admin\UserAdmin

sonata_formatter:
    formatters:
        markdown:
            service: sonata.formatter.text.markdown
            extensions:
                - sonata.formatter.twig.control_flow
                - sonata.formatter.twig.gist
        #        - sonata.media.formatter.twig #keep this commented unless you are using media bundle.

        text:
            service: sonata.formatter.text.text
            extensions:
                - sonata.formatter.twig.control_flow
                - sonata.formatter.twig.gist
        #        - sonata.media.formatter.twig

        rawhtml:
            service: sonata.formatter.text.raw
            extensions:
                - sonata.formatter.twig.control_flow
                - sonata.formatter.twig.gist
        #        - sonata.media.formatter.twig

        richhtml:
            service: sonata.formatter.text.raw
            extensions:
                - sonata.formatter.twig.control_flow
                - sonata.formatter.twig.gist
        #        - sonata.media.formatter.twig

        twig:
            service: sonata.formatter.text.twigengine
            extensions: [] # Twig formatter cannot have extensions

fos_user:
    db_driver:  orm # can be orm or odm
    firewall_name:  main
    user_class:  Application\Sonata\UserBundle\Entity\User

    group:
        group_class:  Application\Sonata\UserBundle\Entity\Group
        group_manager: sonata.user.orm.group_manager

    service:
        user_manager: sonata.user.orm.user_manager

fos_elastica:
    clients:
        default:
            host: "%elastica_host%"
            port: "%elastica_port%"
    indexes:
        app:
            types:
                author:
                    mappings:
                        name:
                            type: "multi_field"
                            fields:
                                name:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_analyzer
                                name_exact:
                                    type:     "string"
                                    index:    "not_analyzed"
                                    analyzer: standard
                                name_sort:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_sort_analizer
                                name_phrase:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_phrase_analyzer
                                name_prefix:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_prefix_analizer
                        country:
                            type: "multi_field"
                            fields:
                                country:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_analyzer
                                country_exact:
                                    type:     "string"
                                    index:    "not_analyzed"
                                    analyzer: standard
                                country_sort:
                                    type:     "string"
                                    analyzer: app_sort_analizer
                                country_phrase:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_phrase_analyzer
                        sex:
                            type: "string"
                            fields:
                                sex:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_analyzer
                                sex_exact:
                                    type:     "string"
                                    index:    "not_analyzed"
                                    analyzer: standard
                                sex_sort:
                                    type:     "string"
                                    analyzer: app_sort_analizer
                                sex_phrase:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_phrase_analyzer
                        birthDate:
                            type: "multi_field"
                            fields:
                                birthDate:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_analyzer
                                birthDate_exact:
                                    type:     "string"
                                    index:    "not_analyzed"
                                    analyzer: standard
                                birthDate_sort:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_sort_analizer
                                birthDate_phrase:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_phrase_analyzer
                        continent:
                            type: "multi_field"
                            fields:
                                continent:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_analyzer
                                continent_exact:
                                    type:     "string"
                                    index:    "not_analyzed"
                                    analyzer: standard
                                continent_sort:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_sort_analizer
                                continent_phrase:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_phrase_analyzer
                        job:
                            type: "multi_field"
                            fields:
                                job:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_analyzer
                                job_exact:
                                    type:     "string"
                                    index:    "not_analyzed"
                                    analyzer: standard
                                job_sort:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_sort_analizer
                                job_phrase:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_phrase_analyzer
                    persistence:
                        # the driver can be orm, mongodb, phpcr or propel
                        # listener and finder are not supported by
                        # propel and should be removed
                        driver: orm
                        model: ThoughtBundle\Entity\Author
                        listener:
                            insert: true
                            update: true
                            delete: true
                        provider: ~
                        finder: ~
                        elastica_to_model_transformer:
                            ignore_missing: true
                thought:
                    mappings:
                        content:
                            type: "multi_field"
                            fields:
                                content:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_analyzer
                                content_exact:
                                    type:     "string"
                                    index:    "not_analyzed"
                                    ignore_above: 10000
                                    analyzer: standard
                                content_sort:
                                    type:     "string"
                                    index:    "analyzed"
                                    ignore_above: 10000
                                    analyzer: app_sort_analizer
                                content_phrase:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_phrase_analyzer
                        author:
                            type: "multi_field"
                            fields:
                                author:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_analyzer
                                author_exact:
                                    type:     "string"
                                    index:    "not_analyzed"
                                    analyzer: standard
                                author_sort:
                                    type:     "string"
                                    analyzer: app_sort_analizer
                                author_phrase:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_phrase_analyzer

                        tags:
                            type: "multi_field"
                            fields:
                                tags:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_analyzer
                                tags_exact:
                                    type:     "string"
                                    index:    "not_analyzed"
                                    analyzer: standard
                                tags_sort:
                                    type:     "string"
                                    analyzer: app_sort_analizer
                                tags_phrase:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_phrase_analyzer

                        thoughtInfo:
                            type: "multi_field"
                            fields:
                                thoughtInfo:
                                    analyzer: app_analyzer
                                    type:  "string"
                                    index: "analyzed"
                                thoughtInfo_exact:
                                    type:  "string"
                                    index: "not_analyzed"
                                thoughtInfo_sort:
                                    type:  "string"
                                    analyzer: app_sort_analizer
                                thoughtInfo_phrase:
                                    type:  "string"
                                    analyzer: app_phrase_analyzer
                        category:
                            type: "multi_field"
                            fields:
                                category:
                                    type:  "string"
                                    index: "analyzed"
                                    analyzer: app_analyzer
                                category_exact:
                                    type:     "string"
                                    index:    "not_analyzed"
                                    analyzer: standard
                                category_sort:
                                    type:     "string"
                                    analyzer: app_sort_analizer
                                category_phrase:
                                    type:     "string"
                                    index: "analyzed"
                                    analyzer: app_phrase_analyzer
                        amount:
                            type: "integer"
                        liked:
                            type: "integer"
                    persistence:
                        # the driver can be orm, mongodb, phpcr or propel
                        # listener and finder are not supported by
                        # propel and should be removed
                        driver: orm
                        model: ThoughtBundle\Entity\Thought
                        provider: ~
                        listener:
                            is_indexable_callback: "thought.isPublish()"
                            #immediate: ~
                        finder: ~
                        elastica_to_model_transformer:
                            ignore_missing: true
            settings:
                index:
                    analysis:
                        analyzer:
                            app_analyzer:
                                type: custom
                                tokenizer: whitespace
                                filter   : [app_ngram, my_asciifolding, lowercase, my_word_delimiter]
                            app_sort_analizer:
                                type: custom
                                tokenizer: keyword
                                filter   : [lowercase, french]
                            app_prefix_analizer:
                                type: custom
                                tokenizer: keyword
                                filter   : [lowercase, my_asciifolding]
                            app_phrase_analyzer:
                                type: custom
                                tokenizer: whitespace
                                filter   : [my_asciifolding, lowercase, my_word_delimiter]
                        tokenizer:
                            #nGram:
                            #    type:     "nGram"
                            #    min_gram: 4
                            #    max_gram: 20
                        filter:
                            app_ngram:
                                type: "nGram"
                                min_gram: 1
                                max_gram: 20
                            stopwords:
                                type:      stop
                                stopwords: [_french_]
                                ignore_case : true
                            my_word_delimiter:
                                catenate_words: true
                                type: word_delimiter
                            my_asciifolding:
                                type: asciifolding
                                preserve_original: true
                            french:
                                type:     "icu_collation"
                                language: "fr"

knp_paginator:
    page_range: 5                      # default page range used in pagination control
    default_options:
        page_name: page                # page query parameter name
        sort_field_name: sort          # sort field query parameter name
        sort_direction_name: direction # sort direction query parameter name
        distinct: true                 # ensure distinct results, useful when ORM queries are using GROUP BY statements
    template:
        pagination: KnpPaginatorBundle:Pagination:twitter_bootstrap_v3_pagination.html.twig     # sliding pagination controls template
        sortable: KnpPaginatorBundle:Pagination:sortable_link.html.twig # sort link template