imports:
    - { resource: parameters.yml }
    - { resource: security.yml }
    - { resource: services.yml }
    - { resource: "@ThoughtBundle/Resources/config/services.yml" }
    - { resource: "@ApplicationSonataUserBundle/Resources/config/services.yml" }

# Put parameters here that don't need to change on each machine where the app is deployed
# http://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: fr

framework:
    #esi:             ~
    translator:      { fallbacks: ["%locale%"] }
    secret:          "%secret%"
    router:
        resource: "%kernel.root_dir%/config/routing.yml"
        strict_requirements: ~
    form:            ~
    csrf_protection: ~
    validation:      { enable_annotations: true }
    #serializer:      { enable_annotations: true }
    templating:
        engines: ['twig']
    default_locale:  "%locale%"
    trusted_hosts:   ~
    trusted_proxies: ~
    session:
        # handler_id set to null will use default session handler from php.ini
        handler_id:  ~
    fragments:       ~
    http_method_override: true

# Twig Configuration
twig:
    debug:            "%kernel.debug%"
    strict_variables: "%kernel.debug%"

    #sonata
    form:
        resources:
            - 'SonataFormatterBundle:Form:formatter.html.twig'

# Doctrine Configuration
doctrine:
    dbal:
        driver:   pdo_mysql
        host:     "%database_host%"
        port:     "%database_port%"
        dbname:   "%database_name%"
        user:     "%database_user%"
        password: "%database_password%"
        charset:  UTF8
        # if using pdo_sqlite as your database driver:
        #   1. add the path in parameters.yml
        #     e.g. database_path: "%kernel.root_dir%/data/data.db3"
        #   2. Uncomment database_path in parameters.yml.dist
        #   3. Uncomment next line:
        #     path:     "%database_path%"
        types:
            json: Sonata\Doctrine\Types\JsonType

    orm:
        auto_generate_proxy_classes: "%kernel.debug%"

        #auto_mapping: true

        entity_managers:
            default:
                auto_mapping: true
                naming_strategy: doctrine.orm.naming_strategy.underscore

# Swiftmailer Configuration
swiftmailer:
    transport: "%mailer_transport%"
    host:      "%mailer_host%"
    username:  "%mailer_user%"
    password:  "%mailer_password%"
    spool:     { type: memory }

sonata_block:
    default_contexts: [cms]
    blocks:
        # Enable the SonataAdminBundle block
        sonata.admin.block.admin_list:
           contexts:  [admin]
        sonata.user.block.menu:  # used to display the menu in profile pages
        sonata.user.block.account: # used to display menu option (login option)
        sonata.block.service.text: # used to if you plan to use Sonata user routes

sonata_admin:
    title: 'French thoughts'
    templates:
        # default global templates
        layout:  ThoughtBundle::Sonata/Admin/layout.html.twig
#        list:    ThoughtBundle::CRUD/base_list.html.twig

    dashboard:
        groups:
            sonata_user:
                label: Users
                items:
                    - sonata.user.admin.user
            Thoughts:
                label: Thoughts
                items:
                    - thoudght.admin.thought
            Content:
                label: Content
                items: {Instruction: thoudght.admin.content}


sonata_user:
    #security_acl: true # Uncomment for ACL support
    manager_type: orm # can be orm or mongodb
    profile:
        menu:
            - { route: 'sonata_user_profile_show', label: 'user.dashboard.menu.link_dashboard', domain: 'messages'}
            - { route: 'sonata_user_profile_edit', label: 'user.dashboard.menu.link_profile', domain: 'messages'}
            - { route: 'sonata_user_thoughts', label: 'user.dashboard.menu.link_thoughts', domain: 'messages'}
        form:
            type:               application_sonata_user_profile
            handler:            sonata.user.profile.form.handler.default
            name:               application_sonata_user_profile
            validation_groups:
                - CustomProfile

        register:
            form:
                type:           front_user_registration
                handler:        sonata.user.registration.form.handler.default
                name:           front_user_registration_form
                validation_groups:
                    - CustomRegistration
    admin:
        user:
          class:      ThoughtBundle\Admin\UserAdmin

sonata_formatter:
    formatters:
        markdown:
            service: sonata.formatter.text.markdown
            extensions:
                - sonata.formatter.twig.control_flow
                - sonata.formatter.twig.gist
        #        - sonata.media.formatter.twig #keep this commented unless you are using media bundle.

        text:
            service: sonata.formatter.text.text
            extensions:
                - sonata.formatter.twig.control_flow
                - sonata.formatter.twig.gist
        #        - sonata.media.formatter.twig

        rawhtml:
            service: sonata.formatter.text.raw
            extensions:
                - sonata.formatter.twig.control_flow
                - sonata.formatter.twig.gist
        #        - sonata.media.formatter.twig

        richhtml:
            service: sonata.formatter.text.raw
            extensions:
                - sonata.formatter.twig.control_flow
                - sonata.formatter.twig.gist
        #        - sonata.media.formatter.twig

        twig:
            service: sonata.formatter.text.twigengine
            extensions: [] # Twig formatter cannot have extensions

fos_user:
    db_driver:  orm # can be orm or odm
    firewall_name:  main
    user_class:  Application\Sonata\UserBundle\Entity\User

    group:
        group_class:  Application\Sonata\UserBundle\Entity\Group
        group_manager: sonata.user.orm.group_manager

    service:
        user_manager: sonata.user.orm.user_manager

fos_elastica:
    clients:
        default:
            host: "%elastica_host%"
            port: "%elastica_port%"
    indexes:
        app:
            index_name: thought
            types:
                thought:
                    mappings:
                        content:
                            analyzer: app_analyzer
                        author:
                            type: "multi_field"
                            fields:
                                author:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_analyzer
                                author_exact:
                                    type:     "string"
                                    index:    "not_analyzed"
                                    analyzer: standard
                                author_sort:
                                    type:     "string"
                                    analyzer: app_sort_analizer
                        tags:
                            type: "multi_field"
                            fields:
                                tags:
                                    type:     "string"
                                    index:    "analyzed"
                                    analyzer: app_analyzer
                                tags_exact:
                                    type:     "string"
                                    index:    "not_analyzed"
                                    analyzer: standard
                        thoughtInfo:
                            type: "multi_field"
                            fields:
                                thoughtInfo:
                                    analyzer: app_analyzer
                                    type:  "string"
                                    index: "analyzed"
                                thoughtInfo_exact:
                                    type:  "string"
                                    index: "not_analyzed"
                        category:
                            type: "multi_field"
                            fields:
                                category:
                                    type:  "string"
                                    index: "analyzed"
                                    analyzer: app_analyzer
                                category_exact:
                                    type:     "string"
                                    index:    "not_analyzed"
                                    analyzer: standard
                                category_sort:
                                    type:     "string"
                                    analyzer: app_sort_analizer
                        amount:
                            type: "integer"
                    persistence:
                        # the driver can be orm, mongodb, phpcr or propel
                        # listener and finder are not supported by
                        # propel and should be removed
                        driver: orm
                        model: ThoughtBundle\Entity\Thought
                        provider: ~
                        listener:
                            is_indexable_callback: "thought.isPublish()"
                            #immediate: ~
                        finder: ~
            settings:
                index:
                    analysis:
                        analyzer:
                            app_analyzer:
                                type: custom
                                tokenizer: standard
                                filter   : [app_ngram, my_asciifolding, lowercase, my_word_delimiter]
                            app_sort_analizer:
                                type: custom
                                tokenizer: keyword
                                filter   : [lowercase, french]
                        tokenizer:
                            #nGram:
                            #    type:     "nGram"
                            #    min_gram: 4
                            #    max_gram: 20
                        filter:
                            app_ngram:
                                type: "nGram"
                                min_gram: 1
                                max_gram: 20
                            stopwords:
                                type:      stop
                                stopwords: [_french_]
                                ignore_case : true
                            my_word_delimiter:
                                catenate_words: true
                                type: word_delimiter
                            my_asciifolding:
                                type: asciifolding
                                preserve_original: true
                            french:
                                type:     "icu_collation"
                                language: "fr"

knp_paginator:
    page_range: 5                      # default page range used in pagination control
    default_options:
        page_name: page                # page query parameter name
        sort_field_name: sort          # sort field query parameter name
        sort_direction_name: direction # sort direction query parameter name
        distinct: true                 # ensure distinct results, useful when ORM queries are using GROUP BY statements
    template:
        pagination: KnpPaginatorBundle:Pagination:twitter_bootstrap_v3_pagination.html.twig     # sliding pagination controls template
        sortable: KnpPaginatorBundle:Pagination:sortable_link.html.twig # sort link template