security:
    encoders:
        FOS\UserBundle\Model\UserInterface: sha512

    providers:
        fos_userbundle:
            id: fos_user.user_provider.username

    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]
        ROLE_ADMIN:
            - ROLE_MODERATOR
            - ROLE_SONATA_ADMIN
            - ROLE_ADMIN_THOUGHT_ALL
            - ROLE_SONATA_USER_ADMIN_USER_ALL
            - ROLE_ADMIN_CONTENT_ALL
            - ROLE_ADMIN_AUTHOR_ALL
        ROLE_MODERATOR:
            - ROLE_USER
            - ROLE_ADMIN_THOUGHT_ALL
        ROLE_TEACHER:
            - ROLE_USER

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            pattern: ^/
            user_checker: security.user_checker
            form_login:
                provider: fos_userbundle
                csrf_token_generator: security.csrf.token_manager

            logout:       true
            anonymous:    true

    access_control:
        - { path: ^/login$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/register, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/resetting, role: IS_AUTHENTICATED_ANONYMOUSLY }

        - { path: ^/admin/, role: [ROLE_MODERATOR] }
        - { path: ^/profile/, role: [ROLE_USER, ROLE_STUDENT] }
        - { path: ^//teacher/, role: [ROLE_TEACHER] }
        - { path: ^/topics, role: [ROLE_USER, ROLE_STUDENT] }
        - { path: ^/.*, role: IS_AUTHENTICATED_ANONYMOUSLY }
