# To get started with security, check out the documentation:
# http://symfony.com/doc/current/book/security.html
security:

    role_hierarchy:
        ROLE_ADMIN:
          - ROLE_USER
          - ROLE_SONATA_ADMIN
          - ROLE_MODERATOR
          #-----
          - ROLE_SONATA_USER_ADMIN_USER_CREATE
          - ROLE_SONATA_USER_ADMIN_USER_DELETE
          - ROLE_SONATA_USER_ADMIN_USER_EDIT
          - ROLE_SONATA_USER_ADMIN_USER_LIST
          - ROLE_SONATA_USER_ADMIN_USER_VIEW
          - ROLE_SONATA_USER_ADMIN_USER_EXPORT
          - ROLE_SONATA_USER_ADMIN_USER_OPERATOR
          - ROLE_SONATA_USER_ADMIN_USER_MASTER
          #-----
          - ROLE_THOUDGHT_ADMIN_THOUGHT_CREATE
          - ROLE_THOUDGHT_ADMIN_THOUGHT_DELETE
          - ROLE_THOUDGHT_ADMIN_THOUGHT_EDIT
          - ROLE_THOUDGHT_ADMIN_THOUGHT_LIST
          - ROLE_THOUDGHT_ADMIN_THOUGHT_VIEW
          - ROLE_THOUDGHT_ADMIN_THOUGHT_EXPORT
          - ROLE_THOUDGHT_ADMIN_THOUGHT_OPERATOR
          - ROLE_THOUDGHT_ADMIN_THOUGHT_MASTER
          #-----
          - ROLE_THOUDGHT_ADMIN_CONTENT_CREATE
          - ROLE_THOUDGHT_ADMIN_CONTENT_DELETE
          - ROLE_THOUDGHT_ADMIN_CONTENT_EDIT
          - ROLE_THOUDGHT_ADMIN_CONTENT_LIST
          - ROLE_THOUDGHT_ADMIN_CONTENT_VIEW
          - ROLE_THOUDGHT_ADMIN_CONTENT_EXPORT
          - ROLE_THOUDGHT_ADMIN_CONTENT_OPERATOR
          - ROLE_THOUDGHT_ADMIN_CONTENT_MASTER
          #-----
          - ROLE_THOUDGHT_ADMIN_AUTHOR_CREATE
          - ROLE_THOUDGHT_ADMIN_AUTHOR_DELETE
          - ROLE_THOUDGHT_ADMIN_AUTHOR_EDIT
          - ROLE_THOUDGHT_ADMIN_AUTHOR_LIST
          - ROLE_THOUDGHT_ADMIN_AUTHOR_VIEW
          - ROLE_THOUDGHT_ADMIN_AUTHOR_EXPORT
          - ROLE_THOUDGHT_ADMIN_AUTHOR_OPERATOR
          - ROLE_THOUDGHT_ADMIN_AUTHOR_MASTER
        ROLE_MODERATOR:
          - ROLE_USER
          - ROLE_SONATA_STUFF
          - ROLE_SONATA_ADMIN
          - ROLE_THOUDGHT_ADMIN_THOUGHT_CREATE
          - ROLE_THOUDGHT_ADMIN_THOUGHT_DELETE
          - ROLE_THOUDGHT_ADMIN_THOUGHT_EDIT
          - ROLE_THOUDGHT_ADMIN_THOUGHT_LIST
          - ROLE_THOUDGHT_ADMIN_THOUGHT_VIEW
          - ROLE_THOUDGHT_ADMIN_THOUGHT_EXPORT
          - ROLE_THOUDGHT_ADMIN_THOUGHT_OPERATOR
          - ROLE_THOUDGHT_ADMIN_THOUGHT_MASTER
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]
        SONATA:
          - ROLE_SONATA_PAGE_ADMIN_PAGE_EDIT  # comment it when using acl

    # http://symfony.com/doc/current/book/security.html#where-do-users-come-from-user-providers
    providers:
        fos_userbundle:
            id: fos_user.user_provider.username

    encoders:
        FOS\UserBundle\Model\UserInterface: sha512

    firewalls:
        # disables authentication for assets and the profiler, adapt it according to your needs
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # -> custom firewall for the admin area of the URL
#        admin:
#            pattern:  /admin(.*)
#            context:  user
#            form_login:
#                provider:  fos_userbundle
#                login_path:  /admin/login
#                use_forward:  false
#                check_path:  /admin/login_check
#                failure_path:  null
#            logout:
#                path:  /admin/logout
#            anonymous:  true
        # -> end custom configuration

        main:
            pattern: ^/
            form_login:
                provider: fos_userbundle
                csrf_provider: form.csrf_provider
            logout:  true
            anonymous:  true

    access_control:
        # URL of FOSUserBundle which need to be available to anonymous users
        - { path: ^/login$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/register, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/resetting, role: IS_AUTHENTICATED_ANONYMOUSLY }

        # Admin login page needs to be access without credential
        - { path: ^/admin/thought/thought/*, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/admin/login$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/admin/logout$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/admin/login_check$, role: IS_AUTHENTICATED_ANONYMOUSLY }

        # Secured part of the site
        # This config requires being logged for the whole site
        # and having the admin role for the admin part.
        # Change these rules to adapt them to your needs
        - { path: ^/admin/, role: [ROLE_ADMIN, ROLE_SONATA_ADMIN] }

        - { path: ^/chain/, role: [IS_AUTHENTICATED_ANONYMOUSLY, ROLE_USER, ROLE_ADMIN, ROLE_SONATA_ADMIN] }
        - { path: ^/profile/, role: [ROLE_STUDENT, ROLE_USER, ROLE_ADMIN, ROLE_SONATA_ADMIN] }
        - { path: ^/topics, role: [ROLE_STUDENT, ROLE_USER, ROLE_ADMIN, ROLE_SONATA_ADMIN] }
        - { path: ^/.*, role: IS_AUTHENTICATED_ANONYMOUSLY }
